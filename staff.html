<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온닷컴 사전질문지 답변 확인</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
<style>
  :root{
    --navy:#124572;
    --navy-10:#eaf0f6;
    --ink:#121212;
    --muted:#5b6370;
    --line:#dfe4ea;
    --bg:#f3f5f8;
    --white:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
    font-size:15px; line-height:1.6; letter-spacing:-0.02em;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  header{background:var(--navy); color:var(--white)}
  .bar{max-width:960px; margin:0 auto; padding:16px; display:flex; align-items:center; gap:12px}
  .bar svg{width:30px; height:auto; fill:var(--white); flex:none}
  .bar h1{margin:0; font-size:18px; font-weight:700; letter-spacing:-0.03em}
  main{max-width:960px; margin:0 auto; padding:20px 16px 60px}

  .card{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:20px}
  .btn{height:48px; padding:0 20px; border:0; border-radius:10px; background:var(--navy); color:var(--white); font:inherit; font-weight:700; cursor:pointer}
  .gate{max-width:400px; margin:40px auto 0}
  .gate label{display:block; font-weight:700; margin-bottom:8px}
  .gate input{width:100%; height:52px; border:1px solid var(--line); border-radius:10px; padding:0 14px; font:inherit; font-size:16px}
  .gate input:focus{outline:none; border-color:var(--navy)}
  .gate .btn{width:100%; margin-top:10px}
  .error{color:#c0392b; font-size:13px; margin:10px 0 0}
  .msg{text-align:center; color:var(--muted); padding:40px 0}

  /* 업체 선택 */
  .picker-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .picker-head h2{margin:0; font-size:18px}
  .picker-head span{color:var(--muted); font-weight:400; font-size:13px; margin-left:6px}
  .toggle{background:none; border:0; color:var(--navy); font:inherit; font-size:14px; font-weight:600; cursor:pointer; padding:4px}
  .companies{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .picker.closed .companies{display:none}
  .companies button{
    min-height:44px; padding:8px; border:1px solid var(--line); border-radius:10px;
    background:var(--white); color:var(--ink); font:inherit; font-size:14px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .companies button:hover{border-color:var(--navy); color:var(--navy)}
  .companies button.on{background:var(--navy); border-color:var(--navy); color:var(--white); font-weight:700}

  /* 내용 정리 */
  #detail{margin-top:16px}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:16px; border-bottom:2px solid var(--navy)}
  .detail-head h2{margin:0; font-size:26px; letter-spacing:-0.03em}
  .detail-head p{margin:4px 0 0; color:var(--muted); font-size:13px}
  .detail-head .btn{flex:none}
  section{padding:18px 0; border-bottom:1px solid var(--line)}
  section:last-child{border-bottom:0; padding-bottom:0}
  section h3{margin:0 0 10px; font-size:18px; color:var(--navy)}
  dl{margin:0; display:grid; grid-template-columns:220px 1fr; gap:8px 16px}
  dt{color:var(--muted)}
  dd{margin:0; white-space:pre-wrap}
  dd.empty{color:var(--muted)}

  @media (max-width:720px){
    .companies{grid-template-columns:repeat(3,1fr)}
    dl{grid-template-columns:1fr; gap:0}
    dd{margin-bottom:10px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg role="img" aria-label="다온닷컴" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85.31 68.35"><g><path d="M25.6,0H2.36s0,68.35,0,68.35h23.24c18.88,0,34.18-15.3,34.18-34.18h0C59.78,15.3,44.48,0,25.6,0ZM29.2,44.15h-6.5v-19.94h6.78c6.04,0,10.83,5.37,9.84,11.6-.77,4.87-5.19,8.33-10.12,8.33Z"/><path d="M68,24.21h6.04c4.92,0,8.91,3.99,8.91,8.91v2.12c0,4.92-3.99,8.91-8.91,8.91h-6.04v-19.94h0Z" transform="translate(150.95 68.35) rotate(-180)"/></g></svg>
    <h1>사전질문지 답변 확인</h1>
  </div>
</header>

<main>
  <div class="card gate" id="gate" hidden>
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="off">
    <button class="btn" id="enter">입장</button>
    <p class="error" id="gateError"></p>
  </div>

  <p class="msg" id="msg">불러오는 중...</p>

  <div id="app" hidden>
    <div class="card picker" id="picker">
      <div class="picker-head">
        <h2>답변 업체 선택<span id="count"></span></h2>
        <button class="toggle" id="toggle">접기 ▲</button>
      </div>
      <div class="companies" id="companies"></div>
    </div>
    <div class="card" id="detail" hidden></div>
  </div>
</main>

<script>
(function(){
  // Code.gs 웹 앱 주소 (index.html 과 같은 배포)
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyjcRK851mvsc0fx3XY3iFG_dmXt5pJ0T5_DO4k6ah4lsr-p945LW2VYfy1SfqvcuRv/exec';
  var $ = function(id){ return document.getElementById(id); };
  var data = null, current = -1;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }

  function showGate(err){
    $('msg').hidden = true;
    $('gate').hidden = false;
    $('gateError').textContent = err || '';
    $('pw').focus();
  }

  // 비밀번호는 이 브라우저에 기억 — 다음부터는 바로 목록이 보임
  function load(){
    var key = localStorage.getItem('presurveyKey');
    if (!key) return showGate();
    $('gate').hidden = true;
    $('msg').hidden = false;
    $('msg').textContent = '불러오는 중...';
    fetch(WEBAPP_URL + '?key=' + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          if (res.error.indexOf('비밀번호') > -1) { localStorage.removeItem('presurveyKey'); return showGate(res.error); }
          $('msg').textContent = res.error;
          return;
        }
        data = res;
        $('msg').hidden = true;
        $('app').hidden = false;
        renderCompanies();
      })
      .catch(function(){ $('msg').textContent = '불러오지 못했습니다. 잠시 후 새로고침해주세요.'; });
  }

  function renderCompanies(){
    var rows = data.rows;
    $('count').textContent = rows.length + '곳';
    if (!rows.length) { $('companies').innerHTML = '<p class="msg">아직 답변이 없습니다.</p>'; return; }
    // 같은 업체명이 여러 번 제출된 경우 제출일을 붙여 구분
    var seen = {};
    rows.forEach(function(r){ seen[r[1]] = (seen[r[1]] || 0) + 1; });
    $('companies').innerHTML = rows.map(function(r, i){
      var name = r[1] || '(업체명 없음)';
      if (seen[r[1]] > 1) name += ' (' + r[0].slice(5, 10) + ')';
      return '<button data-i="' + i + '" title="' + esc(name) + '">' + esc(name) + '</button>';
    }).join('');
  }

  // 화면·메모장 공통: [섹션 제목, [[질문, 답변], ...]]
  function sectionsOf(row){
    var col = 1;
    return data.sections.map(function(s){
      return [s[0], s[1].map(function(label){ return [label, row[col++] || '']; })];
    });
  }

  function show(i){
    current = i;
    var row = data.rows[i];
    [].forEach.call($('companies').children, function(b){ b.classList.toggle('on', +b.dataset.i === i); });
    $('detail').innerHTML =
      '<div class="detail-head"><div><h2>' + esc(row[1] || '(업체명 없음)') + '</h2><p>제출일시 ' + esc(row[0]) + '</p></div>' +
      '<button class="btn" id="download">메모장 다운로드</button></div>' +
      sectionsOf(row).map(function(s){
        return '<section><h3>' + esc(s[0]) + '</h3><dl>' + s[1].map(function(qa){
          return '<dt>' + esc(qa[0]) + '</dt>' + (qa[1] ? '<dd>' + esc(qa[1]) + '</dd>' : '<dd class="empty">—</dd>');
        }).join('') + '</dl></section>';
      }).join('');
    $('detail').hidden = false;
  }

  function download(){
    var row = data.rows[current];
    var lines = ['제출일시: ' + row[0], ''];
    sectionsOf(row).forEach(function(s){
      lines.push(s[0]);
      s[1].forEach(function(qa){ lines.push('- ' + qa[0] + ': ' + qa[1]); });
      lines.push('', '');
    });
    // 윈도우 메모장용: BOM + CRLF
    var text = '﻿' + lines.join('\n').replace(/\r?\n/g, '\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    a.download = '2026희망리턴 사전질문지 - ' + (row[1] || '업체명없음').replace(/[\\/:*?"<>|]/g, '_') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('companies').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (b) show(+b.dataset.i);
  });
  $('detail').addEventListener('click', function(e){
    if (e.target.id === 'download') download();
  });
  $('toggle').addEventListener('click', function(){
    var closed = $('picker').classList.toggle('closed');
    this.textContent = closed ? '펼치기 ▼' : '접기 ▲';
  });

  $('enter').addEventListener('click', function(){
    var pw = $('pw').value.trim();
    if (!pw) return;
    localStorage.setItem('presurveyKey', pw);
    load();
  });
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('enter').click(); });

  load();
})();
</script>
</body>
</html>
